site_name:  Thomas' Digital Garden
site_description: My collection of things I've learned.
site_author: Thomas Hühn
site_url: https://www.2uo.de

theme: 
  name: material
  font: false
  language: en
  features:
        - navigation.top

plugins:
    - search:
        lang: en
    - minify:
        minify_html: true
        minify_js: true
        minify_css: true
        htmlmin_opts:
            remove_comments: true
      
markdown_extensions:
  - admonition
  - toc:
     permalink: true

extra:
    generator: false
 
