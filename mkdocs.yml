site_name:  Thomas' Digital Garden
site_description: My collection of things I've learned.
site_author: Thomas Hühn
site_url: https://www.2uo.de

theme: 
    name: material
    font: false
    language: en
    features:
        - navigation.top
        - navigation.instant
        - navigation.instant.progress
        - navigation.tracking
        - navigation.sections
        - navigation.prune
        - toc.follow

    palette:

        # Palette toggle for automatic mode
        - media: "(prefers-color-scheme)"
          toggle:
            icon: material/brightness-auto
            name: Switch to light mode

        # Palette toggle for light mode
        - media: "(prefers-color-scheme: light)"
          scheme: default 
          toggle:
            icon: material/brightness-7
            name: Switch to dark mode

        # Palette toggle for dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          toggle:
            icon: material/brightness-4
            name: Switch to system preference

plugins:
    - search:
        lang: en
    - minify:
        minify_html: true
        minify_js: true
        minify_css: true
        htmlmin_opts:
            remove_comments: true

markdown_extensions:
    - admonition
    - toc:
        permalink: true
    - pymdownx.tabbed:
        slugify: !!python/object/apply:pymdownx.slugs.slugify
            kwds:
            case: lower

extra:
    generator: false
 
