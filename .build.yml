image: debian/stable
packages:
- python3
- rsync
sources:
- https://git.sr.ht/~huehn/www.2uo.de
secrets:
- b3dc0e2a-38b9-4e85-8514-2f01ed189aec
tasks:
- install-mkdocs: |
    sudo apt install python3-pip -y
    sudo pip3 install mkdocs mkdocs-material mkdocs-minify-plugin
- build: |
    cd www.2uo.de
    mkdocs build
- deploy: |
    cd www.2uo.de
    ln -sf ~/.ssh/b3dc0e2a-38b9-4e85-8514-2f01ed189aec ~/.ssh/id_rsa
    rsync --rsh="ssh -o StrictHostKeyChecking=no" -rzP site/ sourcehut-2uo@94.130.150.135:/
