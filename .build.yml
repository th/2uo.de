image: debian/stable
packages:
- python3
- python3-pip
- python3.11-venv
- rsync
sources:
- https://git.sr.ht/~huehn/www.2uo.de
secrets:
- b3dc0e2a-38b9-4e85-8514-2f01ed189aec
tasks:
- prepare-venv:
    python3 -m venv .venv
- install-mkdocs: |
    .venv/bin/pip install mkdocs mkdocs-material mkdocs-minify-plugin
- build: |
    cd www.2uo.de
    .venv/bin/mkdocs build
- deploy: |
    cd www.2uo.de
    ln -sf ~/.ssh/b3dc0e2a-38b9-4e85-8514-2f01ed189aec ~/.ssh/id_rsa
    rsync --rsh="ssh -o StrictHostKeyChecking=no" --delete -rzP site/ sourcehut@94.130.150.135:/www.2uo.de/
